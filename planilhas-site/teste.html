<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Integração</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #0b0b14, #1a1a2e);
            color: #eaeef2;
        }
        .card {
            text-align: center;
            padding: 48px;
            border: 1px solid #2a2a38;
            border-radius: 20px;
            background: #16161f;
        }
        h1 { color: #f59e0b; margin-bottom: 16px; }
        p { color: #8888a0; }
        .badge {
            display: inline-block;
            background: rgba(16,185,129,0.15);
            color: #10b981;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.85rem;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>✅ Teste de Integração</h1>
        <p>Hermes + Linear + Orca</p>
        <div class="badge">Funcionando</div>
    </div>
</body>
</html>
